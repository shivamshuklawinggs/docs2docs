# Apache configuration for Next.js app deployed under /docks2doc
# Place this in your Apache virtual host configuration

# Enable mod_proxy, mod_proxy_http, and mod_rewrite
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule rewrite_module modules/mod_rewrite.so

# Proxy requests to Next.js server running on port 7003
ProxyPass /docks2doc http://localhost:7003/docks2doc
ProxyPassReverse /docks2doc http://localhost:7003/docks2doc

# Preserve the original host header
ProxyPreserveHost On

# Optional: Serve static files directly for better performance
# Alias /docks2doc/_next/static "/path/to/your/project/.next/static"
# <Directory "/path/to/your/project/.next/static">
#     Options FollowSymLinks
#     AllowOverride None
#     Require all granted
#     ExpiresActive On
#     ExpiresDefault "access plus 1 year"
#     Header set Cache-Control "public, immutable"
# </Directory>
